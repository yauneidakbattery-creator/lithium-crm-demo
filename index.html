<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="锂电池CRM公开演示版"><title>锂电池CRM · 演示版</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#202a38;background:#f6f8fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}a{color:#3659a7}.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}.side{background:#fff;border-right:1px solid #e4e9f0;display:flex;flex-direction:column;padding:23px 13px}.brand{font-size:21px;font-weight:760;margin:0 10px 30px;white-space:nowrap}.brand em{font-style:normal;color:#3a61b0}.nav{width:100%;border:0;background:transparent;text-align:left;color:#6c7888;border-radius:9px;padding:12px 13px;margin:3px 0}.nav.active{background:#eaf0fa;color:#294c9a;font-weight:700}.nav:hover,.account:hover{background:#f2f5fa}.account{margin-top:auto;border:0;border-top:1px solid #e9ecf1;background:transparent;text-align:left;padding:19px 10px 10px;color:#263448;font-weight:650}.account small{display:block;font-weight:400;color:#8995a3;margin-top:4px}.account-menu{display:none;margin:5px 0 0;border:1px solid #e3e8ee;background:#fff;border-radius:8px;padding:5px}.account-menu.show{display:block}.account-menu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px;border-radius:6px;color:#405063}.account-menu button:hover{background:#edf2f9}.main{padding:27px clamp(16px,3vw,40px);min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{font-size:26px;margin:0 0 6px}.muted{color:#8491a1}.desc{font-size:13px;margin-bottom:23px}.button{border:1px solid #dce3eb;border-radius:8px;background:#fff;color:#27374c;padding:10px 13px}.button.primary{background:#253960;color:#fff;border-color:#253960}.button:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9bb8ee;outline-offset:2px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.toolbar input,.toolbar select{background:#fff;border:1px solid #dce3eb;border-radius:8px;padding:10px 12px;min-height:41px;color:#354457}.toolbar input{margin-left:auto;min-width:220px}.tabs{display:flex;gap:20px;border-bottom:1px solid #e0e6ee;margin-top:22px}.tab{border:0;background:none;padding:0 1px 11px;color:#7b8898}.tab.active{color:#2c4e9b;border-bottom:2px solid #2c4e9b;font-weight:700}.panel{background:#fff;border:1px solid #e3e8ee;border-radius:11px;padding:19px;margin-bottom:15px}.panel h2{font-size:16px;margin:0 0 16px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:15px}.tablewrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;min-width:660px;font-size:13px}.table th{text-align:left;color:#8894a2;font-size:12px;font-weight:550;background:#fafbfd;padding:13px;border-bottom:1px solid #e7ebf0}.table td{padding:14px 13px;border-bottom:1px solid #edf0f4}.table tbody tr{cursor:pointer}.table tbody tr:hover,.table tbody tr.selected{background:#f0f4fb}.table tbody tr:last-child td{border-bottom:0}.table small{display:block;color:#8c99a7;margin-top:4px}.tag{display:inline-block;background:#eef2f7;color:#536577;border-radius:6px;padding:4px 8px;font-size:11px;white-space:nowrap}.tag.orange{background:#fff0e2;color:#ab641a}.tag.blue{background:#e8efff;color:#345caf}.drawer{background:#fff;border:1px solid #e3e8ee;border-radius:11px;padding:19px}.drawer h2{margin:0 0 5px;font-size:20px}.line{border-top:1px solid #e9edf2;margin:15px 0}.kv{display:grid;grid-template-columns:105px 1fr;gap:8px;font-size:12px;margin:11px 0;line-height:1.45}.kv span:first-child{color:#8995a3}.drawer h3{font-size:13px;margin:0 0 12px}.drawer .button{margin:8px 6px 0 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat strong{font-size:19px}.stat small{display:block;color:#8895a3;margin-bottom:7px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:12px;color:#687787;margin-bottom:7px}.field .value{padding:11px 12px;border:1px solid #dfe5ec;border-radius:8px;min-height:42px;background:#fafbfd;font-size:13px}.person,.rule{padding:13px 0;border-top:1px solid #edf0f4;font-size:13px}.person:first-of-type,.rule:first-of-type{border-top:0}.person small,.rule small{display:block;color:#8a97a4;margin-top:5px}.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:15px}.notice{padding:12px;border-radius:8px;background:#fff7e8;color:#7a5d28;font-size:12px;line-height:1.5;margin-top:13px}.detail-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.detail-top h1{margin:0}.links{display:flex;flex-wrap:wrap;gap:8px}.tiny{font-size:12px}.empty{padding:28px;text-align:center;color:#8895a3}.demo-banner{background:#e9eef8;border-bottom:1px solid #dbe4f2;color:#40577f;padding:10px 20px;text-align:center;font-size:12px}
@media(max-width:950px){.layout,.split{grid-template-columns:1fr}.drawer{max-width:none}}@media(max-width:700px){.app{grid-template-columns:1fr}.side{flex-direction:row;align-items:center;gap:4px;overflow:auto;padding:8px}.brand{font-size:15px;margin:0 8px;flex:none}.nav{width:auto;white-space:nowrap}.account,.account-menu{display:none}.main{padding:18px}.grid,.formgrid{grid-template-columns:1fr}.toolbar input{margin-left:0;width:100%}}
</style></head><body><div class="demo-banner">公开演示版 · 所有人名、邮箱、客户归属和业务记录均为示例，不连接真实客户表格</div><div class="app"><aside class="side"><div class="brand"><em>✦</em> 锂电池CRM</div><nav aria-label="主导航"><button class="nav" data-page="home">工作台</button><button class="nav" data-page="customers">客户管理</button><button class="nav" data-page="contacts">联系人</button><button class="nav" data-page="deals">商机与报价</button><button class="nav" data-page="tasks">跟进任务</button><button class="nav" data-page="research">背调资料</button><button class="nav" data-page="users">用户与权限</button></nav><button class="account" id="account" aria-expanded="false">● 演示账号　⌄<small>老板视角 · 全部区域</small></button><div class="account-menu" id="account-menu"><button data-page="settings">个人设置</button><button data-page="users">用户与权限</button><button id="logout">退出登录（演示）</button></div></aside><main class="main" id="view" aria-live="polite"></main></div>
<script>
const $=s=>document.querySelector(s);const clients=[{id:'US-MAR-001',name:'West Marine',domain:'westmarine.com',type:'零售/分销',region:'美国东部',owner:'待分配',next:'核实电池类目买手',people:[['Paulee Day','CEO · 管理层'],['Mark Howerton','供应链负责人']],note:'已销售船用电池；具体电池采购权限和新供应商准入待核实。'}, {id:'US-MAR-004',name:'Mercury Marine',domain:'mercurymarine.com',type:'船用动力制造',region:'美国中部',owner:'待分配',next:'核实供应商准入',people:[['John G. Buelow','总裁'],['采购相关人选','电池品类权限待核实']],note:'电动船外机使用电池系统；现有合作关系需进一步核实。'}, {id:'DEMO-003',name:'Harbor Energy Supply',domain:'example.com',type:'电池分销',region:'美国东部',owner:'张业务（示例）',next:'确认产品规格',people:[['采购负责人','待核实']],note:'演示客户资料，仅用于展示页面流程。'}, {id:'DEMO-004',name:'Pacific Electric Boats',domain:'example.com',type:'电动船制造',region:'美国西部',owner:'李业务（示例）',next:'确认电池需求',people:[['技术负责人','待核实']],note:'演示客户资料，仅用于展示页面流程。'}];
let page='customers',selected=0,filter='全部客户',term='',region='全部区域';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shell(title,desc,action=''){return `<div class="top"><h1>${title}</h1>${action}</div><div class="muted desc">${desc}</div>`}
function customerRows(){let items=clients.filter(c=>(filter==='全部客户'||(filter==='待分配'?c.owner==='待分配':c.owner!=='待分配'))&&(region==='全部区域'||c.region===region)&&(`${c.name} ${c.domain} ${c.people.map(p=>p[0]).join(' ')}`).toLowerCase().includes(term.toLowerCase()));return items.length?items.map(c=>`<tr data-client="${clients.indexOf(c)}" class="${selected===clients.indexOf(c)?'selected':''}"><td><strong>${esc(c.name)}</strong><small>${esc(c.domain)}</small></td><td>美国</td><td>${esc(c.type)}</td><td><span class="tag orange">未联系</span></td><td>${esc(c.owner)}</td><td>${esc(c.next)}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">没有符合条件的演示客户</td></tr>`}
function drawer(){let c=clients[selected];return `<section class="drawer"><h2>${esc(c.name)}</h2><div class="muted tiny">美国 · ${esc(c.type)}</div><div class="line"></div><h3>客户概况</h3><div class="kv"><span>客户编号</span><span>${esc(c.id)}</span></div><div class="kv"><span>所属区域</span><span>${esc(c.region)}</span></div><div class="kv"><span>客户负责人</span><span>${esc(c.owner)}</span></div><div class="kv"><span>官网</span><span>${esc(c.domain)}</span></div><div class="line"></div><h3>关键人员</h3>${c.people.map(p=>`<div class="kv"><span>${esc(p[0])}</span><span>${esc(p[1])}</span></div>`).join('')}<div class="line"></div><h3>开发状态</h3><div class="kv"><span>开发阶段</span><span>未联系</span></div><div class="kv"><span>下一步行动</span><span>${esc(c.next)}</span></div><div class="kv"><span>背调摘要</span><span>${esc(c.note)}</span></div><button class="button primary" data-page="detail">查看完整档案 →</button><button class="button" id="assign">分配负责人</button></section>`}
function customers(){return shell('客户管理','按区域和负责人查看客户开发进度','<button class="button primary" id="new-customer">＋ 新建客户</button>')+`<div class="tabs">${['全部客户','我的客户','待分配'].map(t=>`<button class="tab ${filter===t?'active':''}" data-filter="${t}">${t}</button>`).join('')}</div><div class="toolbar"><select id="region" aria-label="所属区域">${['全部区域','美国东部','美国中部','美国西部'].map(x=>`<option ${region===x?'selected':''}>${x}</option>`).join('')}</select><input id="search" aria-label="搜索客户" placeholder="搜索公司、联系人…" value="${esc(term)}"></div><div class="layout"><section class="panel" style="padding:0"><div class="tablewrap"><table class="table"><thead><tr><th>客户名称</th><th>国家</th><th>类型</th><th>阶段</th><th>客户负责人</th><th>下一步行动</th></tr></thead><tbody>${customerRows()}</tbody></table></div></section>${drawer()}</div>`}
function detail(){let c=clients[selected];return `<button class="button" data-page="customers">← 返回客户列表</button><div class="detail-top" style="margin:20px 0"><div><h1>${esc(c.name)}</h1><div class="muted tiny">${esc(c.region)} · ${esc(c.type)} · ${esc(c.domain)}</div></div><span class="tag orange">未联系</span></div><div class="grid"><div class="panel stat"><small>客户负责人</small><strong>${esc(c.owner)}</strong></div><div class="panel stat"><small>开发阶段</small><strong>线索研究</strong></div><div class="panel stat"><small>下一步行动</small><strong>${esc(c.next)}</strong></div></div><div class="split"><div><section class="panel"><h2>关键人员</h2>${c.people.map(p=>`<div class="person"><strong>${esc(p[0])}</strong><small>${esc(p[1])} · 个人直联待核实</small></div>`).join('')}</section><section class="panel"><h2>客户与背调</h2><p>${esc(c.note)}</p><div class="notice">公开演示只展示示例摘要，不存储真实联系人或采购资料。</div></section></div><div><section class="panel"><h2>跟进记录</h2><div class="rule">完成初步研究<small>尚未进行客户联系</small></div><div class="rule">下一步：${esc(c.next)}<small>建议事项，非已执行动作</small></div></section><section class="panel"><h2>商机与报价</h2><div class="kv"><span>预计采购量</span><span>待确认</span></div><div class="kv"><span>报价</span><span>尚未报价</span></div><div class="kv"><span>样品</span><span>尚未启动</span></div></section></div></div>`}
function users(){return shell('用户与权限','演示角色、负责区域和客户归属规则','<button class="button primary" id="invite">＋ 邀请业务员</button>')+`<div class="grid"><div class="panel stat"><small>团队成员</small><strong>4 人 · 示例</strong></div><div class="panel stat"><small>销售区域</small><strong>3 个 · 示例</strong></div><div class="panel stat"><small>待分配客户</small><strong>2 家 · 示例</strong></div></div><div class="split"><section class="panel"><h2>团队成员</h2><div class="tablewrap"><table class="table"><thead><tr><th>成员</th><th>角色</th><th>区域</th><th>客户范围</th></tr></thead><tbody><tr><td>老板账号</td><td>老板</td><td>全部区域</td><td>全部客户</td></tr><tr><td>张业务（示例）</td><td>业务员</td><td>美国东部</td><td>本人客户</td></tr><tr><td>李业务（示例）</td><td>业务员</td><td>美国西部</td><td>本人客户</td></tr><tr><td>王业务（示例）</td><td>业务员</td><td>美国中部</td><td>本人客户</td></tr></tbody></table></div></section><div><section class="panel"><h2>角色权限</h2><div class="rule"><strong>老板</strong><small>查看全部客户、分配负责人、审批报价、管理用户</small></div><div class="rule"><strong>业务员</strong><small>查看本人客户、维护联系人和跟进、创建报价草稿</small></div></section><section class="panel"><h2>客户归属</h2><div class="rule">按销售区域建议分配<small>地区不明或跨区客户进入待分配池</small></div><div class="rule">移交保留历史<small>跟进、报价与背调证据随客户档案保留</small></div></section></div></div><div class="notice">演示版中的权限是界面说明，没有真正登录或访问限制。</div>`}
function settings(){return shell('个人设置','当前演示账号的资料、安全和通知偏好')+`<div class="split"><div><section class="panel"><h2>基本资料</h2><div class="formgrid"><div class="field"><label>显示名称</label><div class="value">演示账号</div></div><div class="field"><label>角色</label><div class="value">老板 · 管理员</div></div><div class="field"><label>登录邮箱</label><div class="value">演示环境无真实登录邮箱</div></div><div class="field"><label>负责区域</label><div class="value">全部区域</div></div></div></section><section class="panel"><h2>通知偏好</h2><div class="rule">✓ 待跟进客户提醒</div><div class="rule">✓ 新客户分配提醒</div><div class="rule">✓ 报价审批提醒</div></section></div><div><section class="panel"><h2>账号安全</h2><div class="rule">密码 <small>正式版接入身份验证后开放</small></div><div class="rule">两步验证 <small>正式版接入身份验证后开放</small></div><div class="rule">登录设备 <small>正式版接入身份验证后开放</small></div></section><section class="panel"><h2>团队管理</h2><p class="tiny">老板可在用户与权限页管理业务员和区域。</p><button class="button" data-page="users">前往用户与权限 →</button></section></div></div>`}
function simple(title,desc,body){return shell(title,desc)+`<section class="panel">${body}</section>`}
function render(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));let html={customers:customers,detail,users,settings,home:()=>simple('工作台','查看团队当前的演示状态','<div class="grid"><div class="panel stat"><small>客户线索</small><strong>4 家</strong></div><div class="panel stat"><small>待分配</small><strong>2 家</strong></div><div class="panel stat"><small>待核实采购角色</small><strong>4 家</strong></div></div><button class="button primary" data-page="customers">进入客户管理 →</button>'),contacts:()=>simple('联系人','按客户查看采购与管理层线索','<div class="rule">Paulee Day · West Marine · CEO</div><div class="rule">Mark Howerton · West Marine · 供应链负责人</div><div class="rule">John G. Buelow · Mercury Marine · 总裁</div><div class="notice">个人直联资料未在公开演示版展示。</div>'),deals:()=>simple('商机与报价','从客户需求到报价、样品的工作流','<div class="rule">暂无已确认报价或样品记录</div>'),tasks:()=>simple('跟进任务','集中处理下一步行动','<div class="rule">West Marine · 核实电池类目买手</div><div class="rule">Mercury Marine · 核实供应商准入</div>'),research:()=>simple('背调资料','来源和事实状态与客户档案关联','<div class="rule">已确认 · 客户有船用电池业务</div><div class="rule">待核实 · 具体采购权限与当前需求</div>')}[page]();$('#view').innerHTML=html;bind()}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;$('#account-menu').classList.remove('show');render()});document.querySelectorAll('[data-client]').forEach(r=>r.onclick=()=>{selected=Number(r.dataset.client);render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});if($('#region'))$('#region').onchange=e=>{region=e.target.value;render()};if($('#search'))$('#search').oninput=e=>{term=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};['new-customer','assign','invite'].forEach(id=>{let el=document.getElementById(id);if(el)el.onclick=()=>alert('公开演示版仅供预览，暂不保存客户或用户资料。')})}
$('#account').onclick=()=>{let m=$('#account-menu');m.classList.toggle('show');$('#account').setAttribute('aria-expanded',String(m.classList.contains('show')))};$('#logout').onclick=()=>alert('演示版没有真实登录会话。');render();
</script></body></html>
